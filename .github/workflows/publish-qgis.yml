name: Publish to plugins.qgis.org

# Se declenche uniquement sur un tag de version (ex: v1.2.0), jamais sur un
# simple push vers main. Le tag doit correspondre exactement a la version
# declaree dans metadata.txt (verifie par scripts/publish_qgis.py) :
#   git tag v1.2.0
#   git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # softprops/action-gh-release a besoin d'ecrire le contenu du depot ;
    # le token Actions est en lecture seule par defaut et repondrait 403.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Publier sur plugins.qgis.org
        env:
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: python scripts/publish_qgis.py

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: magic_search.*.zip
          generate_release_notes: true
